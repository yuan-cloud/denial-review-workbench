# Place decrypted secrets into deploy-time configuration.
# SOPS decryption happens in the pre_tasks of site.yml.
# This role uses the decrypted vault_* variables.
---
- name: Write backend .env from decrypted secrets
  ansible.builtin.template:
    src: backend.env.j2
    dest: "{{ backend_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  no_log: true
  diff: false

- name: Verify .env is not world-readable
  ansible.builtin.file:
    path: "{{ backend_dir }}/.env"
    mode: "0600"
