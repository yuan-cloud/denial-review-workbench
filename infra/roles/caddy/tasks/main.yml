# Caddy role: install Caddy, deploy Caddyfile, build frontend, start.
---
- name: Install Caddy via official apt repo
  block:
    - name: Download Caddy GPG key
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /usr/share/keyrings/caddy-stable-archive-keyring.asc
        mode: "0644"

    - name: Add Caddy apt repo (signed-by)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
        state: present
        filename: caddy-stable

    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: present
        update_cache: true

- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    validate: "caddy validate --config %s --adapter caddyfile"
  notify: reload caddy

- name: Build frontend
  block:
    - name: Install frontend dependencies
      ansible.builtin.command:
        cmd: /home/ubuntu/.bun/bin/bun install
        chdir: "{{ app_root }}/frontend"
      become_user: ubuntu
      changed_when: true

    - name: Build frontend static assets
      ansible.builtin.command:
        cmd: /home/ubuntu/.bun/bin/bun run build
        chdir: "{{ app_root }}/frontend"
      become_user: ubuntu
      environment:
        VITE_API_BASE: "https://{{ app_domain }}"  # resolveApiBase() falls back to localhost if empty
      changed_when: true

- name: Ensure Caddy is enabled and running
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
