# Base system setup — packages, directories, user config.
# Runs on every deployment. Idempotent.
---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - curl
      - jq
      - git
    state: present

- name: Install Bun (frontend build toolchain)
  block:
    - name: Check if Bun is installed
      ansible.builtin.command: bun --version
      register: bun_check
      changed_when: false
      failed_when: false

    - name: Install Bun via official installer
      ansible.builtin.shell: curl -fsSL https://bun.sh/install | bash
      become_user: ubuntu
      when: bun_check.rc != 0
      args:
        creates: /home/ubuntu/.bun/bin/bun

- name: Ensure app data directory exists
  ansible.builtin.file:
    path: "{{ data_dir }}/runs"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Ensure out directory exists (for Vifei export artifacts)
  ansible.builtin.file:
    path: "{{ app_root }}/out"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
