# Base system setup — packages, directories, user config.
# Runs on every deployment. Idempotent.
---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - curl
      - jq
      - git
    state: present

- name: Ensure app data directory exists
  ansible.builtin.file:
    path: "{{ data_dir }}/runs"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Ensure out directory exists (for Vifei export artifacts)
  ansible.builtin.file:
    path: "{{ app_root }}/out"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
