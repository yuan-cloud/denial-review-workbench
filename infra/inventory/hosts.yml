# Single-host inventory for the Contabo VPS.
#
# ansible_host must be plaintext here because Ansible resolves it
# before connecting — SOPS decryption happens in site.yml pre_tasks,
# which is too late for connection setup.
all:
  hosts:
    workbench:
      ansible_host: 127.0.0.1  # replace with VPS public IP or use SSH config alias
      ansible_user: ubuntu
      ansible_python_interpreter: /usr/bin/python3
