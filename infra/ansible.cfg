[defaults]
inventory = inventory/hosts.yml
roles_path = roles
retry_files_enabled = false
stdout_callback = yaml
# Single host — no need for parallelism
forks = 1

[privilege_escalation]
become = true
become_method = sudo

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
