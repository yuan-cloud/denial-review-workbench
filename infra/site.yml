# Main playbook — single-host deployment for Denial Review Workbench.
#
# Usage:
#   ansible-playbook -i infra/inventory/hosts.yml infra/site.yml
#   ansible-playbook -i infra/inventory/hosts.yml infra/site.yml --tags secrets
#
# Roles run in order: common → secrets → backend → caddy.
# Backend must start before Caddy so the health check in the backend
# role passes before Caddy begins proxying to it.
---
- name: Deploy Denial Review Workbench
  hosts: workbench
  become: true

  pre_tasks:
    - name: Load encrypted secrets
      community.sops.load_vars:
        file: "{{ playbook_dir }}/group_vars/all.sops.yml"
      tags: [always]

  roles:
    - role: common
      tags: [common]
    - role: secrets
      tags: [secrets]
    - role: backend
      tags: [backend]
    - role: caddy
      tags: [caddy]
