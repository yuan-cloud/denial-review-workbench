# Main playbook — single-host deployment for Denial Review Workbench.
#
# Usage:
#   ansible-playbook -i infra/inventory/hosts.yml infra/site.yml
#   ansible-playbook -i infra/inventory/hosts.yml infra/site.yml --tags secrets
#
# Roles run in order: common → secrets → backend → caddy.
# Backend must start before Caddy so the health check in the backend
# role passes before Caddy begins proxying to it.
---
- name: Deploy Denial Review Workbench
  hosts: workbench
  become: true

  pre_tasks:
    - name: Load encrypted secrets
      community.sops.load_vars:
        file: "{{ playbook_dir }}/group_vars/all.sops.yml"
      no_log: true
      diff: false
      tags: [always]

  roles:
    - role: common
      tags: [common]
    - role: secrets
      tags: [secrets]
    - role: backend
      tags: [backend]
    - role: caddy
      tags: [caddy]

  post_tasks:
    - name: Restart backend after secrets-only activation
      ansible.builtin.systemd:
        name: "{{ backend_service }}"
        state: restarted
        daemon_reload: true
      when:
        - "'all' not in ansible_run_tags"
        - "'secrets' in ansible_run_tags"
        - "'backend' not in ansible_run_tags"
      tags: [secrets]

    - name: Verify health endpoint after secrets-only activation
      ansible.builtin.uri:
        url: "{{ health_url }}"
        return_content: true
      register: health_check
      retries: 5
      delay: 2
      until: health_check.status == 200
      when:
        - "'all' not in ansible_run_tags"
        - "'secrets' in ansible_run_tags"
        - "'backend' not in ansible_run_tags"
      tags: [secrets]
